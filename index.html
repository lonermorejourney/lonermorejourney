<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lonermorejourney</title>

  <link rel="stylesheet" href="https://fonts.cdnfonts.com/css/sf-ui-display">
  <link rel="stylesheet" href="https://fonts.cdnfonts.com/css/proxima-nova-2">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="home-container">
    <h2 class="section-title">Últimos escritos</h2>

    <div id="posts-list" class="posts-list">
      <!-- Los posts se inyectarán dinámicamente aquí -->
    </div>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
        try {
            const response = await fetch('posts.json');
            const posts = await response.json();

            const container = document.getElementById('posts-list');
            container.innerHTML = '';

            if (!posts || posts.length === 0) return;

            // 1. Ocultar del feed lo que esté en borrador / preparado (publicado: false)
            const postsPublicados = posts.filter(post => post.publicado !== false);

            postsPublicados.forEach((post, index) => {
                const card = document.createElement('a');
                
                // 2. Enlazar por ID/slug dinámico en lugar de índice numérico
                const postId = post.id || post.slug || index;
                card.href = `obra.html?id=${postId}`;
                card.className = 'post-card';

                const titulo = post.titulo || post.nombre || 'Sin título';
                const portada = post.portada || post.imagen || 'portada.png';
                const tipoTexto = post.tipo === 'individual' ? 'Título' : 'Álbum';
                
                // 3. Soporte de fecha para formato objeto {dia, mes, año} o cadena de texto
                let anio = new Date().getFullYear();
                if (post.fecha) {
                    if (typeof post.fecha === 'object' && post.fecha.año) {
                        anio = post.fecha.año;
                    } else if (typeof post.fecha === 'string') {
                        const partesFecha = post.fecha.split(' ');
                        anio = partesFecha[partesFecha.length - 1] || anio;
                    }
                }

                card.innerHTML = `
                    <img class="post-cover" src="${portada}" alt="${titulo}">
                    <div class="post-info">
                        <h3 class="post-title">${titulo}</h3>
                        <p class="post-meta">${anio} <span class="dot">•</span> ${tipoTexto}</p>
                    </div>
                `;

                container.appendChild(card);
            });

        } catch (error) {
            console.error("Error al cargar los posts en el index:", error);
        }
    });
  </script>
</body>
</html>
