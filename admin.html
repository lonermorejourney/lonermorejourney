<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estudio Privado — Lonermorejourney</title>

  <link rel="stylesheet" href="https://fonts.cdnfonts.com/css/sf-ui-display">
  <link rel="stylesheet" href="https://fonts.cdnfonts.com/css/proxima-nova-2">
  <link rel="stylesheet" href="style.css">

  <style>
    .admin-body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    #login-screen {
      background: rgba(255, 255, 255, 0.95);
      color: #1a1a1a;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      width: 100%;
      max-width: 400px;
      text-align: center;
      z-index: 10;
    }

    #login-screen h2 {
      font-family: var(--fuente-heavy);
      font-size: 24px;
      margin-bottom: 8px;
    }

    #login-screen p {
      font-family: var(--fuente-cuerpo);
      font-size: 14px;
      color: #666;
      margin-bottom: 24px;
    }

    .login-input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-family: var(--fuente-cuerpo);
      font-size: 15px;
      margin-bottom: 16px;
      outline: none;
    }

    .login-btn {
      width: 100%;
      background: #1a1a1a;
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-family: var(--fuente-cuerpo);
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
    }

    .error-msg {
      color: #d9534f;
      font-size: 13px;
      margin-top: 10px;
      display: none;
    }

    #studio-screen {
      display: none;
      width: 100%;
      max-width: 1300px;
      flex-direction: column;
      align-items: center;
      z-index: 2;
    }

    .studio-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      background: rgba(255, 255, 255, 0.9);
      padding: 12px 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    .header-actions-left {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .action-top-btn {
      background: #1a1a1a;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-family: var(--fuente-cuerpo);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .action-top-btn:hover {
      background: #333;
    }

    .action-top-btn.secondary {
      background: #e0e0e0;
      color: #1a1a1a;
    }

    .action-top-btn.secondary:hover {
      background: #d0d0d0;
    }

    .admin-layout {
      display: flex;
      width: 100%;
      gap: 20px;
      position: relative;
    }

    .drafts-sidebar {
      width: 260px;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.2);
      display: flex;
      flex-direction: column;
      max-height: 700px;
    }

    .drafts-sidebar h3 {
      font-family: var(--fuente-heavy);
      font-size: 16px;
      margin-bottom: 15px;
      color: #1a1a1a;
      border-bottom: 1px solid #e0e0e0;
      padding-bottom: 8px;
    }

    .drafts-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .draft-item {
      padding: 10px 12px;
      background: #f4f4f4;
      border-radius: 8px;
      cursor: pointer;
      font-family: var(--fuente-cuerpo);
      font-size: 14px;
      color: #333;
      transition: background 0.2s, color 0.2s;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .draft-item:hover, .draft-item.active {
      background: #1a1a1a;
      color: #fff;
    }

    .document-container {
      flex: 1;
      background: #ffffff;
      color: #1a1a1a;
      border-radius: 12px;
      padding: 30px 40px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      min-height: 700px;
    }

    .editor-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding-bottom: 15px;
      margin-bottom: 20px;
      border-bottom: 1px solid #e0e0e0;
      align-items: center;
    }

    .tool-btn {
      background: #f4f4f4;
      border: 1px solid #dcdcdc;
      padding: 6px 12px;
      border-radius: 6px;
      font-family: var(--fuente-cuerpo);
      font-size: 14px;
      cursor: pointer;
      color: #333;
    }

    .tool-btn:hover {
      background: #eaeaea;
    }

    .doc-title-input {
      font-family: var(--fuente-heavy);
      font-size: 26px;
      border: none;
      border-bottom: 2px dashed #e0e0e0;
      outline: none;
      width: 100%;
      padding-bottom: 8px;
      margin-bottom: 20px;
      color: #1a1a1a;
    }

    .doc-editor {
      flex: 1;
      font-family: 'Times New Roman', Times, serif;
      font-size: 20px;
      line-height: 1.6;
      border: none;
      outline: none;
      width: 100%;
      background: transparent;
      overflow-y: auto;
      white-space: pre-wrap;
    }

    .sidebar-actions {
      width: 240px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .action-card {
      background: rgba(255, 255, 255, 0.95);
      color: #1a1a1a;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      transition: transform 0.2s, background 0.2s;
    }

    .action-card:hover {
      transform: translateY(-3px);
      background: #ffffff;
    }

    .action-icon {
      flex-shrink: 0;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .action-info h3 {
      font-family: var(--fuente-cuerpo);
      font-size: 15px;
      font-weight: 700;
      margin: 0 0 2px 0;
    }

    .action-info p {
      font-family: var(--fuente-cuerpo);
      font-size: 12px;
      color: #666;
      margin: 0;
    }

    @media (max-width: 1050px) {
      .admin-layout {
        flex-direction: column;
      }
      .drafts-sidebar, .sidebar-actions {
        width: 100%;
        max-height: none;
      }
      .sidebar-actions {
        flex-direction: row;
        overflow-x: auto;
      }
      .action-card {
        min-width: 210px;
      }
    }
  </style>
</head>
<body class="admin-body">
  <div class="fondo-oscuro"></div>

  <div id="login-screen">
    <h2>Acceso Restringido</h2>
    <p>Introduce tu token de GitHub</p>
    <input type="password" id="token-input" class="login-input" placeholder="ghp_...">
    <button class="login-btn" onclick="verificarLogin()">Entrar al Estudio</button>
    <div id="error-msg" class="error-msg">Token inválido o error de conexión.</div>
  </div>

  <div id="studio-screen">
    <header class="studio-header">
      <div class="header-actions-left">
        <button class="action-top-btn" onclick="guardarObra()">Guardar obra</button>
        <button class="action-top-btn secondary" onclick="nuevaIdea()">Nueva idea</button>
      </div>
      <div style="display: flex; gap: 15px; align-items: center;">
        <span id="sync-status" style="font-family: var(--fuente-cuerpo); font-size: 12px; color: #666;">Sincronizado</span>
        <a href="index.html" style="color: #1a1a1a; font-family: var(--fuente-cuerpo); text-decoration: none; font-size: 14px; font-weight: 600;">Ver sitio ↗</a>
        <button onclick="cerrarSesion()" style="background: #d9534f; border: none; color: #fff; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-family: var(--fuente-cuerpo); font-size: 13px;">Salir</button>
      </div>
    </header>

    <main class="admin-layout">
      <div class="drafts-sidebar">
        <h3>Obras y Borradores</h3>
        <div id="drafts-list" class="drafts-list"></div>
      </div>

      <div class="document-container">
        <div class="editor-toolbar">
          <button class="tool-btn" style="font-family: 'Times New Roman'; font-style: italic;">Times New Roman</button>
          <button class="tool-btn" title="Negrita" onclick="aplicarFormato('bold')"><b>B</b></button>
          <button class="tool-btn" title="Cursiva" onclick="aplicarFormato('italic')"><i>I</i></button>
          <button class="tool-btn" title="Alinear Centrado" onclick="aplicarFormato('justifyCenter')">Centrar</button>
          <button class="tool-btn" title="Justificar" onclick="aplicarFormato('justifyFull')">Justificar</button>
        </div>

        <input type="text" id="doc-title" class="doc-title-input" placeholder="Título del poema...">
        <div id="doc-editor" class="doc-editor" contenteditable="true" placeholder="Escribe o pega tu texto libremente..."></div>
      </div>

      <div class="sidebar-actions">
        <div class="action-card">
          <div class="action-icon">
            <svg viewBox="0 0 64 64" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="24" cy="32" r="22"></circle><circle cx="24" cy="32" r="2" fill="currentColor"></circle>
              <circle cx="40" cy="24" r="18"></circle><circle cx="48" cy="40" r="14"></circle>
            </svg>
          </div>
          <div class="action-info"><h3>Montar álbum</h3><p>Crear lote completo</p></div>
        </div>
        <div class="action-card">
          <div class="action-icon">
            <svg viewBox="0 0 64 64" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="32" cy="32" r="26"></circle><circle cx="32" cy="32" r="3" fill="currentColor"></circle>
              <path d="M 39 20 A 13 13 0 0 1 39 44"></path><path d="M 43 16 A 18 18 0 0 1 43 48"></path>
            </svg>
          </div>
          <div class="action-info"><h3>Sacar individual</h3><p>Publicación suelta</p></div>
        </div>
        <div class="action-card">
          <div class="action-icon">
            <svg viewBox="0 0 64 28" width="34" height="26" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="14" r="10"></circle><circle cx="12" cy="14" r="1.5" fill="currentColor"></circle>
              <path d="M 24 14 L 38 14 M 34 10 L 38 14 L 34 18"></path>
              <circle cx="52" cy="14" r="10"></circle><circle cx="52" cy="14" r="1.5" fill="currentColor"></circle>
            </svg>
          </div>
          <div class="action-info"><h3>Sucesivo</h3><p>Programar / Secuencia</p></div>
        </div>
      </div>
    </main>
  </div>

  <script>
    let tokenGitHub = localStorage.getItem("github_token");
    let repoInfo = null;
    let borradoresNube = {};
    let obraActualKey = null;

    window.addEventListener('DOMContentLoaded', () => {
      if (localStorage.getItem("admin_logueado") === "true" && tokenGitHub) {
        mostrarEstudio();
      }
    });

    async function verificarLogin() {
      const token = document.getElementById('token-input').value.trim();
      const errorMsg = document.getElementById('error-msg');
      if (!token) { errorMsg.style.display = "block"; return; }

      try {
        const response = await fetch('https://api.github.com/user', {
          headers: { 'Authorization': `token ${token}` }
        });
        if (response.ok) {
          localStorage.setItem("github_token", token);
          localStorage.setItem("admin_logueado", "true");
          tokenGitHub = token;
          mostrarEstudio();
        } else {
          errorMsg.style.display = "block";
        }
      } catch (err) {
        errorMsg.style.display = "block";
      }
    }

    async function mostrarEstudio() {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('studio-screen').style.display = 'flex';
      document.body.style.justifyContent = 'flex-start';
      document.body.style.paddingTop = '15px';

      await detectarRepositorio();
      await cargarBorradoresDeNube();
    }

    async function detectarRepositorio() {
      if (repoInfo) return;
      try {
        const res = await fetch('https://api.github.com/user/repos?per_page=100', {
          headers: { 'Authorization': `token ${tokenGitHub}` }
        });
        const repos = await res.json();
        for (let repo of repos) {
          const check = await fetch(`https://api.github.com/repos/${repo.owner.login}/${repo.name}/contents/admin.html`, {
            headers: { 'Authorization': `token ${tokenGitHub}` }
          });
          if (check.ok) {
            repoInfo = { owner: repo.owner.login, repo: repo.name };
            break;
          }
        }
      } catch (e) { console.error(e); }
    }

    async function cargarBorradoresDeNube() {
      if (!repoInfo) return;
      document.getElementById('sync-status').textContent = "Sincronizando...";
      try {
        const res = await fetch(`https://api.github.com/repos/${repoInfo.owner}/${repoInfo.repo}/contents/drafts.json`, {
          headers: { 'Authorization': `token ${tokenGitHub}` }
        });
        if (res.ok) {
          const data = await res.json();
          borradoresNube = JSON.parse(decodeURIComponent(escape(atob(data.content))));
        } else {
          borradoresNube = {};
        }
        renderizarBorradores();
        document.getElementById('sync-status').textContent = "Sincronizado";
      } catch (e) {
        document.getElementById('sync-status').textContent = "Error de red";
      }
    }

    function renderizarBorradores() {
      const lista = document.getElementById('drafts-list');
      lista.innerHTML = "";
      if (Object.keys(borradoresNube).length === 0) {
        lista.innerHTML = '<p style="font-size: 13px; color: #888; text-align: center; padding: 10px;">Sin obras guardadas</p>';
        return;
      }
      for (let titulo in borradoresNube) {
        const item = document.createElement('div');
        item.className = `draft-item ${obraActualKey === titulo ? 'active' : ''}`;
        item.textContent = titulo;
        item.onclick = () => cargarBorrador(titulo);
        lista.appendChild(item);
      }
    }

    function cargarBorrador(titulo) {
      document.getElementById('doc-title').value = titulo;
      document.getElementById('doc-editor').innerHTML = borradoresNube[titulo];
      obraActualKey = titulo;
      renderizarBorradores();
    }

    async function guardarObra() {
      const titulo = document.getElementById('doc-title').value.trim();
      const contenido = document.getElementById('doc-editor').innerHTML;

      if (!titulo) { alert("Escribe un título para la obra."); return; }
      if (!repoInfo) { alert("Repositorio no detectado."); return; }

      document.getElementById('sync-status').textContent = "Guardando...";

      try {
        let sha = null;
        let remoteDrafts = {};
        const check = await fetch(`https://api.github.com/repos/${repoInfo.owner}/${repoInfo.repo}/contents/drafts.json`, {
          headers: { 'Authorization': `token ${tokenGitHub}` }
        });
        if (check.ok) {
          const fileData = await check.json();
          sha = fileData.sha;
          remoteDrafts = JSON.parse(decodeURIComponent(escape(atob(fileData.content))));
        }

        if (obraActualKey && obraActualKey !== titulo && remoteDrafts[obraActualKey]) {
          delete remoteDrafts[obraActualKey];
        }

        remoteDrafts[titulo] = contenido;
        borradoresNube = remoteDrafts;
        obraActualKey = titulo;

        const encodedContent = btoa(unescape(encodeURIComponent(JSON.stringify(borradoresNube, null, 2))));

        const res = await fetch(`https://api.github.com/repos/${repoInfo.owner}/${repoInfo.repo}/contents/drafts.json`, {
          method: 'PUT',
          headers: {
            'Authorization': `token ${tokenGitHub}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            message: `Guardar obra: ${titulo}`,
            content: encodedContent,
            sha: sha
          })
        });

        if (res.ok) {
          document.getElementById('sync-status').textContent = "Sincronizado";
          renderizarBorradores();
          alert("¡Obra guardada en GitHub correctamente!");
        } else {
          document.getElementById('sync-status').textContent = "Error al guardar";
        }
      } catch (e) {
        document.getElementById('sync-status').textContent = "Error de red";
      }
    }

    function nuevaIdea() {
      const tituloActual = document.getElementById('doc-title').value.trim();
      const textoActual = document.getElementById('doc-editor').innerHTML.trim();

      if ((tituloActual || textoActual) && !borradoresNube[tituloActual]) {
        if (!confirm("Tienes cambios sin guardar. ¿Deseas limpiar la página?")) {
          return;
        }
      }

      document.getElementById('doc-title').value = "";
      document.getElementById('doc-editor').innerHTML = "";
      obraActualKey = null;
      renderizarBorradores();
    }

    function aplicarFormato(comando) {
      document.execCommand(comando, false, null);
      document.getElementById('doc-editor').focus();
    }

    function cerrarSesion() {
      localStorage.removeItem("admin_logueado");
      localStorage.removeItem("github_token");
      location.reload();
    }
  </script>
</body>
</html>
