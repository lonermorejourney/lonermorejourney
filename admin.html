<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor del Álbum - Panel</title>
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --text-color: #ffffff;
            --accent-color: #ff4757;
            --border-color: #333;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--panel-bg);
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .btn {
            background: #fff;
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-danger { background: var(--accent-color); color: #fff; }
        .main-container {
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            gap: 20px;
        }
        .panel {
            background: var(--panel-bg);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }
        textarea, input {
            width: 100%;
            background: #2b2b2b;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 8px;
            border-radius: 4px;
            margin-top: 5px;
            box-sizing: border-box;
        }
        textarea { height: 100px; resize: vertical; }
        .alert {
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 4px;
            display: none;
        }
        .alert-error { background: #ff4757; color: #fff; }
        .alert-success { background: #2ed573; color: #fff; }
    </style>
</head>
<body>

    <div class="header">
        <button class="btn" onclick="window.location.href='index.html'">← Volver al sitio</button>
        <div id="status-message" class="alert"></div>
        <button class="btn btn-danger" onclick="deployChanges()">Desplegar</button>
    </div>

    <div class="main-container">
        <div class="panel">
            <h3>Obras Disponibles</h3>
            <ul id="obras-list">
                <li>ENTELEQUIAS</li>
                <li>LONER</li>
            </ul>
        </div>

        <div class="panel">
            <h3>Editor del Álbum</h3>
            <div class="form-group">
                <label>Título del Álbum:</label>
                <input type="text" id="album-title" value="EL DISCO DE LAS ESTRELLAS">
            </div>
            <div id="poemas-container">
                <div class="form-group">
                    <label>Poema 1:</label>
                    <input type="text" class="poema-titulo" value="MELODÍA DISONANTE (Feat. Huracán)">
                    <textarea class="poema-texto">Texto del poema 1...</textarea>
                </div>
                <div class="form-group">
                    <label>Poema 2:</label>
                    <input type="text" class="poema-titulo" value="ORFEBRE DE LA INTENCIÓN">
                    <textarea class="poema-texto">Texto del poema 2...</textarea>
                </div>
            </div>
        </div>

        <div class="panel">
            <h3>Configuración</h3>
            <label>Token de GitHub (PAT):</label>
            <input type="password" id="github-token" placeholder="ghp_xxxxxxxxxxxx">
            <button class="btn" style="width:100%; margin-top:10px;" onclick="guardarToken()">Guardar Token</button>
        </div>
    </div>

    <script>
        const REPO_OWNER = "familiaortegareyes16-prog";
        const REPO_NAME = "lonermorjourney";
        const FILE_PATH = "prepared_albums.json"; // Archivo donde se guardan los datos

        function showStatus(message, isError = false) {
            const statusEl = document.getElementById("status-message");
            statusEl.textContent = message;
            statusEl.className = `alert ${isError ? 'alert-error' : 'alert-success'}`;
            statusEl.style.display = "block";
            setTimeout(() => { statusEl.style.display = "none"; }, 5000);
        }

        function guardarToken() {
            const token = document.getElementById("github-token").value;
            if (!token) {
                showStatus("Introduce un token válido", true);
                return;
            }
            localStorage.setItem("github_token", token);
            showStatus("Token guardado correctamente en el navegador");
        }

        document.addEventListener("DOMContentLoaded", () => {
            const savedToken = localStorage.getItem("github_token");
            if (savedToken) {
                document.getElementById("github-token").value = savedToken;
            }
        });

        async function deployChanges() {
            const token = localStorage.getItem("github_token") || document.getElementById("github-token").value;
            if (!token) {
                showStatus("Falta el token de GitHub para autenticar la petición", true);
                return;
            }

            showStatus("Desplegando cambios a GitHub...");

            const albumData = {
                title: document.getElementById("album-title").value,
                poemas: Array.from(document.querySelectorAll("#poemas-container .form-group")).map(group => ({
                    titulo: group.querySelector(".poema-titulo").value,
                    texto: group.querySelector(".poema-texto").value
                })),
                updated_at: new Date().toISOString()
            };

            const apiUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`;

            try {
                // 1. Obtener el SHA actual del archivo (necesario para actualizar en GitHub)
                let sha = "";
                const getResponse = await fetch(apiUrl, {
                    headers: {
                        "Authorization": `token ${token}`,
                        "Accept": "application/vnd.github.v3+json"
                    }
                });

                if (getResponse.ok) {
                    const fileData = await getResponse.json();
                    sha = fileData.sha;
                }

                // 2. Subir/Actualizar el archivo con los nuevos datos
                const contentEncoded = btoa(unescape(encodeURIComponent(JSON.stringify(albumData, null, 2))));
                
                const putResponse = await fetch(apiUrl, {
                    method: "PUT",
                    headers: {
                        "Authorization": `token ${token}`,
                        "Content-Type": "application/json",
                        "Accept": "application/vnd.github.v3+json"
                    },
                    body: JSON.stringify({
                        message: "Actualización de álbum desde panel de administración",
                        content: contentEncoded,
                        sha: sha || undefined
                    })
                });

                if (!putResponse.ok) {
                    const errJson = await putResponse.json();
                    throw new Error(errJson.message || "Error al conectar con la API de GitHub");
                }

                showStatus("¡Desplegado y guardado correctamente en GitHub!");

            } catch (error) {
                console.error("Error de red/GitHub:", error);
                showStatus(`Error de red: ${error.message}`, true);
            }
        }
    </script>
</body>
</html>
