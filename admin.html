<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estudio Privado — Lonermorejourney</title>

  <link rel="stylesheet" href="https://fonts.cdnfonts.com/css/sf-ui-display">
  <link rel="stylesheet" href="https://fonts.cdnfonts.com/css/proxima-nova-2">
  <link rel="stylesheet" href="style.css">

  <style>
    .admin-body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    #login-screen {
      background: rgba(255, 255, 255, 0.95);
      color: #1a1a1a;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      width: 100%;
      max-width: 400px;
      text-align: center;
      z-index: 10;
    }

    #login-screen h2 {
      font-family: var(--fuente-heavy);
      font-size: 24px;
      margin-bottom: 8px;
    }

    #login-screen p {
      font-family: var(--fuente-cuerpo);
      font-size: 14px;
      color: #666;
      margin-bottom: 24px;
    }

    .login-input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-family: var(--fuente-cuerpo);
      font-size: 15px;
      margin-bottom: 16px;
      outline: none;
      transition: border-color 0.2s;
    }

    .login-input:focus {
      border-color: #1a1a1a;
    }

    .login-btn {
      width: 100%;
      background: #1a1a1a;
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-family: var(--fuente-cuerpo);
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .login-btn:hover {
      background: #333;
    }

    .error-msg {
      color: #d9534f;
      font-size: 13px;
      margin-top: 10px;
      display: none;
    }

    #studio-screen {
      display: none;
      width: 100%;
      max-width: 1100px;
      flex-direction: column;
      align-items: center;
      z-index: 2;
    }

    .admin-layout {
      display: flex;
      width: 100%;
      gap: 20px;
      margin-top: 20px;
      position: relative;
    }

    .document-container {
      flex: 1;
      background: #ffffff;
      color: #1a1a1a;
      border-radius: 12px;
      padding: 40px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      min-height: 700px;
    }

    .editor-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding-bottom: 15px;
      margin-bottom: 25px;
      border-bottom: 1px solid #e0e0e0;
      align-items: center;
    }

    .tool-btn, .tool-select {
      background: #f4f4f4;
      border: 1px solid #dcdcdc;
      padding: 6px 12px;
      border-radius: 6px;
      font-family: var(--fuente-cuerpo);
      font-size: 14px;
      cursor: pointer;
      color: #333;
    }

    .doc-title-input {
      font-family: var(--fuente-heavy);
      font-size: 28px;
      border: none;
      border-bottom: 2px dashed #e0e0e0;
      outline: none;
      width: 100%;
      padding-bottom: 8px;
      margin-bottom: 20px;
      color: #1a1a1a;
    }

    .doc-editor {
      flex: 1;
      font-family: 'Times New Roman', Times, serif;
      font-size: 20px;
      line-height: 1.6;
      border: none;
      outline: none;
      resize: none;
      width: 100%;
      background: transparent;
    }

    .sidebar-actions {
      width: 240px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .action-card {
      background: rgba(255, 255, 255, 0.95);
      color: #1a1a1a;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      transition: transform 0.2s, background 0.2s;
    }

    .action-card:hover {
      transform: translateY(-3px);
      background: #ffffff;
    }

    .action-icon {
      flex-shrink: 0;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .action-info h3 {
      font-family: var(--fuente-cuerpo);
      font-size: 15px;
      font-weight: 700;
      margin: 0 0 2px 0;
    }

    .action-info p {
      font-family: var(--fuente-cuerpo);
      font-size: 12px;
      color: #666;
      margin: 0;
    }

    @media (max-width: 850px) {
      .admin-layout {
        flex-direction: column;
      }
      .sidebar-actions {
        width: 100%;
        flex-direction: row;
        overflow-x: auto;
        padding-bottom: 10px;
      }
      .action-card {
        min-width: 210px;
      }
      .document-container {
        padding: 20px;
        min-height: 500px;
      }
    }
  </style>
</head>
<body class="admin-body">
  <div class="fondo-oscuro"></div>

  <!-- PANTALLA DE LOGIN -->
  <div id="login-screen">
    <h2>Acceso Restringido</h2>
    <p>Introduce tu token de GitHub</p>
    <input type="password" id="token-input" class="login-input" placeholder="ghp_...">
    <button class="login-btn" onclick="verificarLogin()">Entrar al Estudio</button>
    <div id="error-msg" class="error-msg">Token inválido o error de conexión.</div>
  </div>

  <!-- ESTUDIO DE CREACIÓN -->
  <div id="studio-screen">
    <header style="width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
      <h1 style="font-family: var(--fuente-heavy); font-size: 22px; color: #fff;">Lonermorejourney <span style="font-weight: 300; font-size: 15px; opacity: 0.8;">— Estudio Privado</span></h1>
      <div style="display: flex; gap: 15px; align-items: center;">
        <a href="index.html" style="color: #fff; font-family: var(--fuente-cuerpo); text-decoration: none; font-size: 14px; opacity: 0.8;">Ver sitio web ↗</a>
        <button onclick="cerrarSesion()" style="background: rgba(255,255,255,0.2); border: none; color: #fff; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-family: var(--fuente-cuerpo); font-size: 13px;">Cerrar sesión</button>
      </div>
    </header>

    <main class="admin-layout">
      <!-- Centro: Documento Word -->
      <div class="document-container">
        <div class="editor-toolbar">
          <select class="tool-select">
            <option>Proxima Nova / Serif</option>
            <option>Times New Roman</option>
            <option>SF UI Display</option>
          </select>
          <button class="tool-btn" title="Negrita"><b>B</b></button>
          <button class="tool-btn" title="Cursiva"><i>I</i></button>
          <button class="tool-btn" title="Alinear Centrado">Centrar</button>
          <button class="tool-btn" title="Justificar">Justificar</button>
        </div>

        <input type="text" class="doc-title-input" placeholder="Escribe el título del título o poema aquí...">
        <textarea class="doc-editor" placeholder="Escribe o pega tu texto libremente... Usa los puntos y aparte que necesites."></textarea>
      </div>

      <!-- Barra lateral derecha -->
      <div class="sidebar-actions">
        <div class="action-card" title="Montar un álbum completo de golpe">
          <div class="action-icon">
            <svg viewBox="0 0 64 64" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="24" cy="32" r="22"></circle>
              <circle cx="24" cy="32" r="2" fill="currentColor"></circle>
              <circle cx="40" cy="24" r="18"></circle>
              <circle cx="48" cy="40" r="14"></circle>
            </svg>
          </div>
          <div class="action-info">
            <h3>Montar álbum</h3>
            <p>Crear lote completo</p>
          </div>
        </div>

        <div class="action-card" title="Publicar un título suelto">
          <div class="action-icon">
            <svg viewBox="0 0 64 64" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="32" cy="32" r="26"></circle>
              <circle cx="32" cy="32" r="3" fill="currentColor"></circle>
              <path d="M 39 20 A 13 13 0 0 1 39 44"></path>
              <path d="M 43 16 A 18 18 0 0 1 43 48"></path>
            </svg>
          </div>
          <div class="action-info">
            <h3>Sacar individual</h3>
            <p>Publicación suelta</p>
          </div>
        </div>

        <div class="action-card" title="Añadir a una secuencia o programación">
          <div class="action-icon">
            <svg viewBox="0 0 64 28" width="34" height="26" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="14" r="10"></circle>
              <circle cx="12" cy="14" r="1.5" fill="currentColor"></circle>
              <path d="M 24 14 L 38 14 M 34 10 L 38 14 L 34 18"></path>
              <circle cx="52" cy="14" r="10"></circle>
              <circle cx="52" cy="14" r="1.5" fill="currentColor"></circle>
            </svg>
          </div>
          <div class="action-info">
            <h3>Sucesivo</h3>
            <p>Programar / Secuencia</p>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      if (localStorage.getItem("admin_logueado") === "true" && localStorage.getItem("github_token")) {
        mostrarEstudio();
      }
    });

    async function verificarLogin() {
      const token = document.getElementById('token-input').value.trim();
      const errorMsg = document.getElementById('error-msg');

      if (!token) {
        errorMsg.textContent = "Introduce un token válido.";
        errorMsg.style.display = "block";
        return;
      }

      try {
        const response = await fetch('https://api.github.com/user', {
          headers: {
            'Authorization': `token ${token}`
          }
        });

        if (response.ok) {
          localStorage.setItem("github_token", token);
          localStorage.setItem("admin_logueado", "true");
          mostrarEstudio();
        } else {
          errorMsg.textContent = "Token de GitHub incorrecto.";
          errorMsg.style.display = "block";
        }
      } catch (err) {
        errorMsg.textContent = "Error de conexión.";
        errorMsg.style.display = "block";
      }
    }

    function mostrarEstudio() {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('studio-screen').style.display = 'flex';
      document.body.style.justifyContent = 'flex-start';
      document.body.style.paddingTop = '20px';
    }

    function cerrarSesion() {
      localStorage.removeItem("admin_logueado");
      localStorage.removeItem("github_token");
      location.reload();
    }
  </script>
</body>
</html>
