<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">Lonermorejourney</title>

  <link rel="stylesheet" href="https://fonts.cdnfonts.com/css/sf-ui-display">
  <link rel="stylesheet" href="https://fonts.cdnfonts.com/css/proxima-nova-2">

  <link rel="stylesheet" href="style.css">
  <script>
    // CEREBRO DE TEMAS: Control anti-parpadeo y Memoria global
    (function() {
      const now = Date.now();
      const savedTheme = localStorage.getItem('tema_visual');
      const savedTime = localStorage.getItem('tema_timestamp');
      let theme = 'blanco-sutil';

      // 1. Validar 12 horas de memoria
      if (savedTheme && savedTime && (now - savedTime < 12 * 3600000)) {
        theme = savedTheme;
      } else {
        // 2. Piloto automático por hora
        const hour = new Date().getHours();
        if (hour >= 19 && hour <= 23) theme = 'lectura-inmersa';
        else if (hour >= 0 && hour < 7) theme = 'gradiente';
      }

      // Aplicar tema
      if (theme !== 'blanco-sutil') document.documentElement.classList.add('tema-' + theme);
      window.__tema_inicial = theme;

      // Mantener el color del gradiente al saltar de página sin parpadear
      const savedColor = localStorage.getItem('tema_color_dinamico');
      if (theme === 'gradiente' && savedColor) {
        document.documentElement.style.setProperty('--color-dinamico', savedColor);
      }
    })();
  </script>
</head>
</head>
<body>
  <div class="fondo-oscuro"></div>

  <main class="album-page">
    <div class="album-card">

      <!-- BOTÓN PINCEL PC (Esquina superior derecha) -->
      <div class="theme-menu-wrapper">
        <button type="button" class="theme-btn" aria-label="Temas" onclick="alternarMenuTema(event, this)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m9.06 11.9 8.07-8.06a2.85 2.85 0 1 1 4.03 4.03l-8.06 8.08"></path>
            <path d="M7.07 14.94c-1.66 0-3 1.35-3 3.02 0 1.33-2.5 1.52-2 2.02 1.08 1.1 2.49 2.02 4 2.02 2.2 0 4-1.8 4-4.04a3.01 3.01 0 0 0-3-3.02z"></path>
          </svg>
        </button>
        <div class="theme-dropdown">
          <button type="button" class="theme-option active" data-theme="blanco-sutil">
            <span class="theme-sample-dot dot-sutil"></span>
            <span>Blanco sutíl</span>
            <span class="theme-check-icon">✓</span>
          </button>
          <button type="button" class="theme-option" data-theme="lectura-inmersa">
            <span class="theme-sample-dot dot-inmersa"></span>
            <span>Lectura inmersa</span>
            <span class="theme-check-icon">✓</span>
          </button>
          <button type="button" class="theme-option" data-theme="gradiente">
            <span class="theme-sample-dot dot-gradiente"></span>
            <span>Tema Gradiente</span>
            <span class="theme-check-icon">✓</span>
          </button>
        </div>
      </div>

      <div class="album-top">
        <img class="album-cover" id="album-cover" src="portada.png" alt="">

        <div class="album-header">
          <p class="album-tag" id="album-tag">Álbum</p>
          <h1 class="album-title"><span id="album-title-text"></span><span class="reg">®</span></h1>

          <!-- Metadatos MÓVIL -->
          <div class="album-meta-mobile">
            <p class="album-genre-count" id="mobile-genre-count">Poesía <span class="dot">•</span> <span id="mobile-count-text">0 Títulos</span></p>
            <p class="album-indicator-date" id="mobile-indicator-date">Álbum</p>
            <div class="album-author-row">
              <img class="album-avatar" src="avatar.jpeg" alt="">
              <p class="album-author">de felipeortegareyes</p>

              <!-- BOTÓN PINCEL MÓVIL (Al lado del autor) -->
              <div class="theme-menu-wrapper">
                <button type="button" class="theme-btn" aria-label="Temas" onclick="alternarMenuTema(event, this)">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m9.06 11.9 8.07-8.06a2.85 2.85 0 1 1 4.03 4.03l-8.06 8.08"></path>
                    <path d="M7.07 14.94c-1.66 0-3 1.35-3 3.02 0 1.33-2.5 1.52-2 2.02 1.08 1.1 2.49 2.02 4 2.02 2.2 0 4-1.8 4-4.04a3.01 3.01 0 0 0-3-3.02z"></path>
                  </svg>
                </button>
                <div class="theme-dropdown">
                  <button type="button" class="theme-option active" data-theme="blanco-sutil">
                    <span class="theme-sample-dot dot-sutil"></span>
                    <span>Blanco sutíl</span>
                    <span class="theme-check-icon">✓</span>
                  </button>
                  <button type="button" class="theme-option" data-theme="lectura-inmersa">
                    <span class="theme-sample-dot dot-inmersa"></span>
                    <span>Lectura inmersa</span>
                    <span class="theme-check-icon">✓</span>
                  </button>
                  <button type="button" class="theme-option" data-theme="gradiente">
                    <span class="theme-sample-dot dot-gradiente"></span>
                    <span>Tema Gradiente</span>
                    <span class="theme-check-icon">✓</span>
                  </button>
                </div>
              </div>
            </div>
          </div>

          <!-- Metadatos PC -->
          <div class="album-meta-desktop">
            <img class="album-avatar" src="avatar.jpeg" alt="">
            <p class="album-meta-desktop-text" id="desktop-meta-text">de felipeortegareyes <span class="dot">•</span> <span id="desktop-date-text"></span> <span class="dot">•</span> <span id="desktop-count-text">0 Títulos</span></p>
          </div>
        </div>
      </div>

      <div class="poems-list" id="poems-list">
        <!-- Los poemas se inyectarán dinámicamente aquí -->
      </div>

      <p class="rights-stamp">®<span id="rights-year"></span> lonermorejourney</p>

    </div>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      try {
        const urlParams = new URLSearchParams(window.location.search);
        const obraParam = urlParams.get('id');

        // Petición con timestamp para evitar la caché del navegador
        const response = await fetch('posts.json?v=' + Date.now());
        const rawPosts = await response.json();

        if (!rawPosts) return;

        let posts = Array.isArray(rawPosts) ? rawPosts : Object.values(rawPosts);
        if (posts.length === 0) return;

        // Buscar obra por id, slug, nombre o índice
        let obra = null;
        if (obraParam !== null) {
          obra = posts.find(p => 
            (p.id && p.id === obraParam) || 
            (p.slug && p.slug === obraParam) || 
            (p.nombre && p.nombre === obraParam) || 
            (p.titulo && p.titulo === obraParam)
          );

          if (!obra && !isNaN(obraParam)) {
            obra = posts[parseInt(obraParam)];
          }
        }

        if (!obra) obra = posts[posts.length - 1];
        if (!obra) return;

        // Extraer variables asegurando fallbacks correctos
        const tituloObra = obra.titulo || obra.nombre || 'Sin título';
        const portadaObra = obra.portada || obra.imagen || 'portada.png';
        const idObra = obra.id || obra.slug || obraParam || 0;

        // ASIGNACIÓN DEL AÑO DE DERECHOS RESERVADO (®)
        const anioDerechosFinal = obra.anioDerechos || 
                                  (obra.fecha && (obra.fecha.año || obra.fecha.anio)) || 
                                  new Date().getFullYear();
        const rightsYearEl = document.getElementById('rights-year');
        if (rightsYearEl) {
          rightsYearEl.textContent = anioDerechosFinal;
        }

        // Procesar fecha (objeto {dia, mes, año} o texto)
        function formatearFecha(fechaObj) {
          if (!fechaObj) return '';
          if (typeof fechaObj === 'object') {
            const dia = fechaObj.dia || '';
            let mes = fechaObj.mes || '';
            const anio = fechaObj.año || fechaObj.anio || '';

            const mesesMap = {
              "1": "ene", "01": "ene", "2": "feb", "02": "feb",
              "3": "mar", "03": "mar", "4": "abr", "04": "abr",
              "5": "may", "05": "may", "6": "jun", "06": "jun",
              "7": "jul", "07": "jul", "8": "ago", "08": "ago",
              "9": "sep", "09": "sep", "10": "oct", "11": "nov", "12": "dic",
              "enero": "ene", "febrero": "feb", "marzo": "mar", "abril": "abr", 
              "mayo": "may", "junio": "jun", "julio": "jul", "agosto": "ago", 
              "septiembre": "sep", "octubre": "oct", "noviembre": "nov", "diciembre": "dic"
            };

            const mesLower = String(mes).toLowerCase().trim();
            if (mesesMap[mesLower]) {
              mes = mesesMap[mesLower];
            }

            return `${dia} ${mes} ${anio}`.trim();
          }
          
          return String(fechaObj).replace(/\//g, ' ').toLowerCase();
        }

        let fechaTexto = formatearFecha(obra.fecha);

        // Asignar en la pestaña limpiando saltos de línea
        const tituloPestana = tituloObra.replace(/\n+/g, ' ').trim();
        document.getElementById('page-title').textContent = `${tituloPestana} — Lonermorejourney`;
        
        const coverImg = document.getElementById('album-cover');
        coverImg.src = portadaObra;
        coverImg.alt = tituloPestana;

        document.getElementById('album-title-text').textContent = tituloObra;
        if (tituloObra.includes('\n')) {
  document.querySelector('.album-title').classList.add('titulo-reducido');
}

        // Filtrar poemas ocultos preservando el índice original para el reproductor
        const rawPoemas = Array.isArray(obra.poemas) ? obra.poemas : [];
        const poemasVisibles = rawPoemas
          .map((poema, index) => ({ data: poema, rawIndex: index }))
          .filter(item => {
            const p = item.data;
            if (typeof p === 'object' && p !== null) {
              return p.oculto !== true;
            }
            return true;
          });

        const totalPoemas = poemasVisibles.length;
        const textoConteo = totalPoemas === 1 ? '1 Título' : `${totalPoemas} Títulos`;

        const tagEl = document.getElementById('album-tag');
        const mobileGenreCountEl = document.getElementById('mobile-genre-count');
        const mobileDateEl = document.getElementById('mobile-indicator-date');
        const desktopMetaTextEl = document.getElementById('desktop-meta-text');

        // CONDICIONAL DE DETECCIÓN: Título Individual vs Álbum
        if (obra.tipo === 'individual') {
          // Móvil: Título • Poesía / Fecha limpia / de felipeortegareyes
          tagEl.textContent = "Título";
          if (mobileGenreCountEl) {
            mobileGenreCountEl.innerHTML = `Título <span class="dot">•</span> Poesía`;
          }
          if (mobileDateEl) {
            mobileDateEl.textContent = fechaTexto; 
          }
          // PC: de felipeortegareyes • Fecha (sin segundo punto ni número de títulos)
          if (desktopMetaTextEl) {
            desktopMetaTextEl.innerHTML = `de felipeortegareyes <span class="dot">•</span> ${fechaTexto}`;
          }
        } else {
          // Móvil: Poesía • X Títulos / Álbum Fecha / de felipeortegareyes
          tagEl.textContent = "Álbum";
          if (mobileGenreCountEl) {
            mobileGenreCountEl.innerHTML = `Poesía <span class="dot">•</span> <span id="mobile-count-text">${textoConteo}</span>`;
          }
          if (mobileDateEl) {
            mobileDateEl.textContent = `Álbum ${fechaTexto}`;
          }
          // PC: de felipeortegareyes • Fecha • X Títulos
          if (desktopMetaTextEl) {
            desktopMetaTextEl.innerHTML = `de felipeortegareyes <span class="dot">•</span> <span id="desktop-date-text">${fechaTexto}</span> <span class="dot">•</span> <span id="desktop-count-text">${textoConteo}</span>`;
          }
        }

        // Renderizar lista de poemas visibles
        const poemsListContainer = document.getElementById('poems-list');
        poemsListContainer.innerHTML = '';

        if (poemasVisibles.length > 0) {
          poemasVisibles.forEach(({ data: poema, rawIndex }) => {
            const poemItem = document.createElement('a');
            poemItem.href = `reproductor.html?id=${encodeURIComponent(idObra)}&poema=${rawIndex}`;
            poemItem.className = 'poem-item';

            const nombrePoema = typeof poema === 'string' ? poema : (poema.titulo || poema.originalTitle || 'Poema sin título');
            const miniatura = (typeof poema === 'object' && poema.imagen) ? poema.imagen : portadaObra;

            poemItem.innerHTML = `
              <img class="poem-cover" src="${miniatura}" alt="">
              <span class="poem-title">${nombrePoema}<span class="reg">®</span></span>
            `;
            poemsListContainer.appendChild(poemItem);
          });
        }

      } catch (error) {
        console.error("Error al renderizar la obra:", error);
      }
    });
    // ==========================================================
    // LÓGICA DE TEMAS, EXTRACCIÓN DINÁMICA Y BOTÓN ATRÁS
    // ==========================================================

    function extraerColorDominante(imgEl) {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = imgEl.width || 50;
      canvas.height = imgEl.height || 50;
      try {
        ctx.drawImage(imgEl, 0, 0, canvas.width, canvas.height);
        const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
        let r = 0, g = 0, b = 0, count = 0;
        
        for(let i = 0; i < data.length; i += 40) {
          let pR = data[i], pG = data[i+1], pB = data[i+2];
          
          // 1. EL FILTRO ANTI-NEGRO: Ignoramos los píxeles muy oscuros.
          // Así obligamos al sistema a buscar el color vivo de la portada.
          if (pR < 30 && pG < 30 && pB < 30) continue;
          
          r += pR; g += pG; b += pB;
          count++;
        }

        // Si absolutamente TODA la portada era negra y no pilló nada, usamos un gris rescate
        if (count === 0) { r = 40; g = 40; b = 40; count = 1; }

        r = Math.floor(r / count);
        g = Math.floor(g / count);
        b = Math.floor(b / count);

        // Conversión HSL
        let rf = r / 255, gf = g / 255, bf = b / 255;
        let max = Math.max(rf, gf, bf), min = Math.min(rf, gf, bf);
        let h, s, l = (max + min) / 2;

        if (max === min) {
          h = s = 0; 
        } else {
          let d = max - min;
          s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
          switch(max) {
            case rf: h = (gf - bf) / d + (gf < bf ? 6 : 0); break;
            case gf: h = (bf - rf) / d + 2; break;
            case bf: h = (rf - gf) / d + 4; break;
          }
          h /= 6;
        }

        const hue = Math.round(h * 360);
        let saturation = Math.round(s * 100);
        let lightness = 25; // Mantenemos tu oscuridad elegante base

        // 2. EL PROTECTOR DE GRISES (Anti-Marrón):
        // Solo potenciamos la saturación si la foto YA TENÍA color real (más del 15%).
        // Si es una foto gris (menos de 15%), la respeta y se queda gris puro.
        if (saturation > 5) {
            saturation = Math.max(saturation, 75);
        }

        const colorFinal = `hsla(${hue}, ${saturation}%, ${lightness}%, 0.95)`;
        localStorage.setItem('tema_color_dinamico', colorFinal);
        return colorFinal;
      } catch(e) {
        return '#2a2a2a'; 
      }
    }

    function aplicarTema(tema) {
      document.documentElement.classList.remove('tema-lectura-inmersa', 'tema-gradiente');
      if (tema !== 'blanco-sutil') {
        document.documentElement.classList.add('tema-' + tema);
      }
      
      // Sincronizar los checks del menú
      document.querySelectorAll('.theme-option').forEach(btn => {
        if (btn.dataset.theme === tema) btn.classList.add('active');
        else btn.classList.remove('active');
      });
    }

    // 1. SOLUCIÓN AL COLOR GRIS (Esperar a que cargue la portada real desde GitHub)
    const coverImgEl = document.getElementById('album-cover') || document.getElementById('player-cover');
    if (coverImgEl) {
      const observer = new MutationObserver((mutations) => {
        mutations.forEach((mutation) => {
          if (mutation.type === 'attributes' && mutation.attributeName === 'src') {
            coverImgEl.addEventListener('load', function onRealLoad() {
              if (document.documentElement.classList.contains('tema-gradiente')) {
                document.documentElement.style.setProperty('--color-dinamico', extraerColorDominante(coverImgEl));
              }
              coverImgEl.removeEventListener('load', onRealLoad);
            }, { once: true });
          }
        });
      });
      observer.observe(coverImgEl, { attributes: true });
    }

    // Funciones del Menú
    function alternarMenuTema(event, btn) {
      event.stopPropagation();
      const wrapper = btn.closest('.theme-menu-wrapper');
      const dropdown = wrapper.querySelector('.theme-dropdown');
      const abierto = dropdown.classList.contains('open');
      document.querySelectorAll('.theme-dropdown.open').forEach(d => d.classList.remove('open'));
      if (!abierto) dropdown.classList.add('open');
    }

    document.addEventListener('click', () => {
      document.querySelectorAll('.theme-dropdown.open').forEach(d => d.classList.remove('open'));
    });

    document.querySelectorAll('.theme-option').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const temaSeleccionado = btn.dataset.theme;
        
        localStorage.setItem('tema_visual', temaSeleccionado);
        localStorage.setItem('tema_timestamp', Date.now());
        
        aplicarTema(temaSeleccionado);
        if (temaSeleccionado === 'gradiente' && coverImgEl && coverImgEl.complete) {
          document.documentElement.style.setProperty('--color-dinamico', extraerColorDominante(coverImgEl));
        }
        document.querySelectorAll('.theme-dropdown.open').forEach(d => d.classList.remove('open'));
      });
    });

    if (window.__tema_inicial) {
      aplicarTema(window.__tema_inicial);
    }

    // 2. SOLUCIÓN AL BOTÓN "ATRÁS" DEL MÓVIL (Fuerza la sincronización al descongelar la página)
    window.addEventListener('pageshow', (e) => {
      if (e.persisted) {
        const savedTheme = localStorage.getItem('tema_visual') || 'blanco-sutil';
        const savedColor = localStorage.getItem('tema_color_dinamico');
        
        aplicarTema(savedTheme);
        if (savedTheme === 'gradiente' && savedColor) {
          document.documentElement.style.setProperty('--color-dinamico', savedColor);
        }
      }
    });
  </script>
</body>
</html>
