<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">Lonermorejourney</title>

  <link rel="stylesheet" href="https://fonts.cdnfonts.com/css/sf-ui-display">
  <link rel="stylesheet" href="https://fonts.cdnfonts.com/css/proxima-nova-2">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="fondo-oscuro"></div>

  <main class="reproductor-page">
    <div class="player-card">

      <!-- Volver al índice -->
      <a href="obra.html" id="back-link" class="back-link">Volver al índice</a>

      <div class="player-content-wrapper">
        
        <!-- Columna Izquierda (Portada, Título con disco, Controles y Copyright) -->
        <div class="player-left">
          <img class="player-cover" id="player-cover" src="portada.png" alt="">

          <div class="player-title-row">
            <h2 class="player-poem-title" id="player-poem-title">
              <span id="poem-title-text">Cargando...</span>
              <span class="disc-icon" title="Disco" style="color: inherit; display: inline-block; vertical-align: middle; margin-left: 6px;">
                <svg class="spin" viewBox="0 0 64 64" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="32" cy="32" r="30"></circle>
                  <circle cx="32" cy="32" r="2" fill="currentColor"></circle>
                  <path d="M 44 22.5 A 16 15 0 0 1 44 41.5"></path>
                  <path d="M 48 17.5 A 20 20 0 0 1 48 46.5"></path>
                  <path d="M 20 41.5 A 16 15 0 0 1 20 22.5"></path>
                  <path d="M 16 46.5 A 20 20 0 0 1 16 17.5"></path>
                </svg>
              </span>
            </h2>
          </div>

          <p class="player-author">de felipeortegareyes <span class="dot">•</span> escritor</p>
          <p class="player-meta" id="player-meta">Poema <span class="dot">•</span> --</p>

          <div class="player-controls">
            <!-- Anterior -->
            <button class="ctrl-btn" id="btn-prev" aria-label="Poema anterior">
              <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="1.5" fill="currentColor">
                <polygon points="11,19 2,12 11,5"></polygon>
                <polygon points="21,19 12,12 21,5"></polygon>
              </svg>
            </button>

            <!-- Reproducir / Pausa -->
            <button class="ctrl-btn ctrl-close" id="btn-play-pause" aria-label="Reproducir/Pausar">
              <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="1.5" fill="currentColor">
                <polygon points="6,4 19,12 6,20"></polygon>
              </svg>
            </button>

            <!-- Siguiente -->
            <button class="ctrl-btn" id="btn-next" aria-label="Poema siguiente">
              <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="1.5" fill="currentColor">
                <polygon points="13,5 22,12 13,19"></polygon>
                <polygon points="3,5 12,12 3,19"></polygon>
              </svg>
            </button>

            <!-- Compartir -->
            <button class="ctrl-btn ctrl-share" id="btn-share" aria-label="Compartir">
              <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="1.5" fill="currentColor">
                <circle cx="18" cy="5" r="3"></circle>
                <circle cx="6" cy="12" r="3"></circle>
                <circle cx="18" cy="19" r="3"></circle>
                <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
                <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
              </svg>
            </button>
          </div>

          <!-- Copyright -->
          <p class="rights-stamp">®<span id="rights-year"></span> lonermorejourney</p>
        </div>

        <!-- Columna Derecha (Poema con scroll interno) -->
        <div class="poem-reading">
          <p class="poem-origin-tag" id="poem-origin-tag">de Álbum</p>
          <div class="poem-scroll">
            <h1 class="poem-title-reading" id="poem-title-reading">Cargando...</h1>
            <div class="poem-body" id="poem-body">
              <!-- El cuerpo del texto se inyectará dinámicamente aquí -->
            </div>
          </div>
        </div>

      </div>

    </div>
  </main>

  <script>
    document.getElementById('rights-year').textContent = new Date().getFullYear();

    document.addEventListener("DOMContentLoaded", async () => {
        try {
            const urlParams = new URLSearchParams(window.location.search);
            const obraId = parseInt(urlParams.get('id')) || 0;
            const poemaId = parseInt(urlParams.get('poema')) || 0;

            const response = await fetch('posts.json');
            const posts = await response.json();

            if (!posts || !posts[obraId]) return;
            const obra = posts[obraId];
            const poemas = obra.poemas || [];
            const poema = poemas[poemaId] || poemas[0];

            if (!poema) return;

            // Extraer nombre y textos del poema
            const nombrePoema = typeof poema === 'string' ? poema : (poema.titulo || 'Sin título');
            
            // Actualizar título de la pestaña del navegador
            document.getElementById('page-title').textContent = `${nombrePoema} — ${obra.titulo} — Lonermorejourney`;

            // Enlace de vuelta al índice de la obra correcta
            document.getElementById('back-link').href = `obra.html?id=${obraId}`;

            // Portada dinámica (prioriza la del poema individual si la tiene, si no usa la del álbum)
            const coverImg = document.getElementById('player-cover');
            coverImg.src = (typeof poema === 'object' && poema.imagen) ? poema.imagen : (obra.imagen || 'portada.png');
            coverImg.alt = nombrePoema;

            // Título con disco giratorio
            document.getElementById('poem-title-text').textContent = nombrePoema;

            // Metadatos y fecha de publicación
            document.getElementById('player-meta').innerHTML = `Poema <span class="dot">•</span> ${obra.fecha}`;

            // Etiqueta de origen (Álbum o Título)
            const originTag = document.getElementById('poem-origin-tag');
            originTag.textContent = obra.tipo === 'individual' ? `de Título` : `de Álbum`;

            // Título grande de lectura
            document.getElementById('poem-title-reading').textContent = nombrePoema;

            // Cuerpo del texto del poema dinámico
            const bodyContainer = document.getElementById('poem-body');
            bodyContainer.innerHTML = '';

            let lineasTexto = [];
            if (typeof poema === 'object' && poema.texto) {
                lineasTexto = Array.isArray(poema.texto) ? poema.texto : [poema.texto];
            } else {
                lineasTexto = ["El contenido de este poema se actualizará próximamente."];
            }

            lineasTexto.forEach(parrafo => {
                const p = document.createElement('p');
                p.innerHTML = parrafo; // Soporta saltos de línea y etiquetas HTML si se requiere
                bodyContainer.appendChild(p);
            });

            // Funcionalidad de los botones de navegación entre poemas
            const btnPrev = document.getElementById('btn-prev');
            const btnNext = document.getElementById('btn-next');

            btnPrev.onclick = () => {
                const prevIndex = poemaId > 0 ? poemaId - 1 : poemas.length - 1;
                window.location.href = `reproductor.html?id=${obraId}&poema=${prevIndex}`;
            };

            btnNext.onclick = () => {
                const nextIndex = poemaId < poemas.length - 1 ? poemaId + 1 : 0;
                window.location.href = `reproductor.html?id=${obraId}&poema=${nextIndex}`;
            };

            // Funcionalidad del botón de compartir
            const btnShare = document.getElementById('btn-share');
            btnShare.onclick = () => {
                if (navigator.share) {
                    navigator.share({
                        title: nombrePoema,
                        text: `Lee "${nombrePoema}" de ${obra.titulo} en Lonermorejourney`,
                        url: window.location.href,
                    }).catch(console.error);
                } else {
                    navigator.clipboard.writeText(window.location.href);
                    alert('¡Enlace del poema copiado al portapapeles!');
                }
            };

        } catch (error) {
            console.error("Error al cargar los datos del reproductor:", error);
        }
    });
  </script>
</body>
</html>
