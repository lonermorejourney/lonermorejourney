<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">Lonermorejourney</title>

  <link rel="stylesheet" href="https://fonts.cdnfonts.com/css/sf-ui-display">
  <link rel="stylesheet" href="https://fonts.cdnfonts.com/css/proxima-nova-2">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="fondo-oscuro"></div>

  <main class="reproductor-page">
    <div class="player-card">

      <!-- Volver al índice -->
      <a href="obra.html" id="back-link" class="back-link">Volver al índice</a>

      <div class="player-content-wrapper">
        
        <!-- Columna Izquierda -->
        <div class="player-left">
          <img class="player-cover" id="player-cover" src="portada.png" alt="">

          <div class="player-title-row">
            <h2 class="player-poem-title" id="player-poem-title">
              <span id="poem-title-text">Cargando...</span>
              <span class="disc-icon" title="Disco" style="color: inherit; display: inline-block; vertical-align: middle; margin-left: 6px;">
                <svg class="spin" viewBox="0 0 64 64" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="32" cy="32" r="30"></circle>
                  <circle cx="32" cy="32" r="2" fill="currentColor"></circle>
                  <path d="M 44 22.5 A 16 15 0 0 1 44 41.5"></path>
                  <path d="M 48 17.5 A 20 20 0 0 1 48 46.5"></path>
                  <path d="M 20 41.5 A 16 15 0 0 1 20 22.5"></path>
                  <path d="M 16 46.5 A 20 20 0 0 1 16 17.5"></path>
                </svg>
              </span>
            </h2>
          </div>

          <p class="player-author">de felipeortegareyes <span class="dot">•</span> escritor</p>
          <p class="player-meta" id="player-meta">Poema <span class="dot">•</span> --</p>

          <div class="player-controls">
            <!-- Anterior -->
            <button class="ctrl-btn" id="btn-prev" aria-label="Poema anterior">
              <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="1.5" fill="currentColor">
                <polygon points="11,19 2,12 11,5"></polygon>
                <polygon points="21,19 12,12 21,5"></polygon>
              </svg>
            </button>

            <!-- Reproducir / Pausa -->
            <button class="ctrl-btn ctrl-close" id="btn-play-pause" aria-label="Reproducir/Pausar">
              <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="1.5" fill="currentColor">
                <polygon points="6,4 19,12 6,20"></polygon>
              </svg>
            </button>

            <!-- Siguiente -->
            <button class="ctrl-btn" id="btn-next" aria-label="Poema siguiente">
              <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="1.5" fill="currentColor">
                <polygon points="13,5 22,12 13,19"></polygon>
                <polygon points="3,5 12,12 3,19"></polygon>
              </svg>
            </button>

            <!-- Compartir -->
            <button class="ctrl-btn ctrl-share" id="btn-share" aria-label="Compartir">
              <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="1.5" fill="currentColor">
                <circle cx="18" cy="5" r="3"></circle>
                <circle cx="6" cy="12" r="3"></circle>
                <circle cx="18" cy="19" r="3"></circle>
                <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
                <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
              </svg>
            </button>
          </div>

          <!-- Copyright -->
          <p class="rights-stamp">®<span id="rights-year"></span> lonermorejourney</p>
        </div>

        <!-- Columna Derecha -->
        <div class="poem-reading">
          <p class="poem-origin-tag" id="poem-origin-tag">de Álbum</p>
          <div class="poem-scroll">
            <h1 class="poem-title-reading" id="poem-title-reading">Cargando...</h1>
            <div class="poem-body" id="poem-body">
              <!-- El cuerpo del texto se inyectará dinámicamente aquí -->
            </div>
          </div>
        </div>

      </div>

    </div>
  </main>

  <script>
    document.getElementById('rights-year').textContent = new Date().getFullYear();

    document.addEventListener("DOMContentLoaded", async () => {
        try {
            const urlParams = new URLSearchParams(window.location.search);
            const obraParam = urlParams.get('id');
            
            const trackVal = urlParams.get('track') !== null ? urlParams.get('track') : urlParams.get('poema');
            const poemaIndex = parseInt(trackVal) || 0;

            const response = await fetch('posts.json');
            const rawPosts = await response.json();

            if (!rawPosts) return;
            const posts = Array.isArray(rawPosts) ? rawPosts : Object.values(rawPosts);
            if (posts.length === 0) return;

            let obra = null;
            if (obraParam !== null) {
                obra = posts.find(p => 
                    (p.id && p.id === obraParam) || 
                    (p.slug && p.slug === obraParam) || 
                    (p.nombre && p.nombre === obraParam) || 
                    (p.titulo && p.titulo === obraParam)
                );

                if (!obra && !isNaN(obraParam)) {
                    obra = posts[parseInt(obraParam)];
                }
            }

            if (!obra) obra = posts[0];
            if (!obra) return;

            const idObra = obra.id || obra.slug || obraParam || 0;
            const tituloObra = obra.titulo || obra.nombre || 'Sin título';
            const portadaObra = obra.portada || obra.imagen || 'portada.png';

            const poemas = obra.poemas || [];
            const poema = poemas[poemaIndex] || poemas[0];
            if (!poema) return;

            const nombrePoema = typeof poema === 'string' ? poema : (poema.titulo || poema.originalTitle || 'Sin título');

            // Procesar fecha limpia sin barras y con mes traducido
            let fechaTexto = '';
            if (obra.fecha) {
                if (typeof obra.fecha === 'object') {
                    const dia = obra.fecha.dia || '';
                    let mes = obra.fecha.mes || '';
                    const anio = obra.fecha.año || obra.fecha.anio || '';

                    const mesesMap = {
                        "1": "ene", "01": "ene", "2": "feb", "02": "feb",
                        "3": "mar", "03": "mar", "4": "abr", "04": "abr",
                        "5": "may", "05": "may", "6": "jun", "06": "jun",
                        "7": "jul", "07": "jul", "8": "ago", "08": "ago",
                        "9": "sep", "09": "sep", "10": "oct", "11": "nov", "12": "dic",
                        "enero": "ene", "febrero": "feb", "marzo": "mar", "abril": "abr", 
                        "mayo": "may", "junio": "jun", "julio": "jul", "agosto": "ago", 
                        "septiembre": "sep", "octubre": "oct", "noviembre": "nov", "diciembre": "dic"
                    };

                    const mesLower = String(mes).toLowerCase().trim();
                    if (mesesMap[mesLower]) {
                        mes = mesesMap[mesLower];
                    }

                    fechaTexto = `${dia} ${mes} ${anio}`.trim();
                } else {
                    fechaTexto = String(obra.fecha).replace(/\//g, ' ').toLowerCase();
                }
            }
            
            document.getElementById('page-title').textContent = `${nombrePoema} — ${tituloObra} — Lonermorejourney`;
            document.getElementById('back-link').href = `obra.html?id=${encodeURIComponent(idObra)}`;

            const coverImg = document.getElementById('player-cover');
            coverImg.src = (typeof poema === 'object' && poema.imagen) ? poema.imagen : portadaObra;
            coverImg.alt = nombrePoema;

            document.getElementById('poem-title-text').textContent = nombrePoema;
            document.getElementById('player-meta').innerHTML = `Poema <span class="dot">•</span> ${fechaTexto}`;

            const originTag = document.getElementById('poem-origin-tag');
            originTag.textContent = obra.tipo === 'individual' ? `de Título` : `de Álbum`;

            document.getElementById('poem-title-reading').textContent = nombrePoema;

            const bodyContainer = document.getElementById('poem-body');
            bodyContainer.innerHTML = '';

            let contenidoTexto = (typeof poema === 'object' && poema.texto) ? poema.texto : '';

            if (Array.isArray(contenidoTexto)) {
                contenidoTexto.forEach(parrafo => {
                    const p = document.createElement('p');
                    p.innerHTML = parrafo;
                    bodyContainer.appendChild(p);
                });
            } else if (typeof contenidoTexto === 'string' && contenidoTexto.trim() !== '') {
                contenidoTexto.split('\n').forEach(linea => {
                    const p = document.createElement('p');
                    p.innerHTML = linea || '&nbsp;';
                    bodyContainer.appendChild(p);
                });
            } else {
                const p = document.createElement('p');
                p.textContent = "El contenido de este poema estará disponible próximamente.";
                bodyContainer.appendChild(p);
            }

            const btnPrev = document.getElementById('btn-prev');
            const btnNext = document.getElementById('btn-next');

            btnPrev.onclick = () => {
                const prevIndex = poemaIndex > 0 ? poemaIndex - 1 : poemas.length - 1;
                window.location.href = `reproductor.html?id=${encodeURIComponent(idObra)}&track=${prevIndex}`;
            };

            btnNext.onclick = () => {
                const nextIndex = poemaIndex < poemas.length - 1 ? poemaIndex + 1 : 0;
                window.location.href = `reproductor.html?id=${encodeURIComponent(idObra)}&track=${nextIndex}`;
            };

            const btnShare = document.getElementById('btn-share');
            btnShare.onclick = () => {
                if (navigator.share) {
                    navigator.share({
                        title: nombrePoema,
                        text: `Lee "${nombrePoema}" de ${tituloObra} en Lonermorejourney`,
                        url: window.location.href,
                    }).catch(console.error);
                } else {
                    navigator.clipboard.writeText(window.location.href);
                    alert('¡Enlace copiado al portapapeles!');
                }
            };

        } catch (error) {
            console.error("Error al cargar los datos del reproductor:", error);
        }
    });
  </script>
</body>
</html>
